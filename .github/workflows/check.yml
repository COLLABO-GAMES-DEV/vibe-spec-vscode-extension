name: Check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      platform:
        description: 'Release callers verify both platforms by default'
        type: string
        default: all
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to verify (no publishing)'
        type: choice
        options: [windows, all]
        default: windows

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # A release call inherits the tag/manual event; ordinary pushes/PRs use Linux.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '["windows-latest"]' || (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        suite: [core-cli, vscode, webview]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: matrix.suite == 'core-cli'
        run: node --test scripts/release.test.mjs
      - if: matrix.suite == 'core-cli'
        run: pnpm typecheck
      - if: matrix.suite == 'core-cli'
        run: pnpm exec vitest run
      - if: matrix.suite == 'vscode' && runner.os == 'Linux'
        run: xvfb-run -a pnpm test:extension
      - if: matrix.suite == 'vscode' && runner.os == 'Windows'
        run: pnpm test:extension
      - if: matrix.suite == 'webview'
        run: pnpm --filter @vibe-spec/webview exec playwright install --with-deps chromium
      - if: matrix.suite == 'webview'
        run: pnpm --filter @vibe-spec/webview exec playwright test --retries=0
      - if: matrix.suite == 'vscode'
        run: pnpm package:vsix
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: test-failure-${{ runner.os }}-${{ matrix.suite }}
          path: packages/webview/test-results/
          if-no-files-found: ignore
          retention-days: 7
