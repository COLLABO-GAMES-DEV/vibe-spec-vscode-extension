name: Marketplace release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dry-run only: expected version tag, e.g. v0.5.1 (no tag is created)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      vsix: ${{ steps.version.outputs.vsix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag and extension manifest
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node scripts/release.mjs check "$RELEASE_TAG"
      - name: Check public Marketplace versions (no credentials)
        run: |
          pnpm --filter vibe-spec exec vsce show ijun17.vibe-spec --json > "$RUNNER_TEMP/marketplace.json"
          node scripts/release.mjs unpublished "$RUNNER_TEMP/marketplace.json"
      - run: pnpm build
      - run: pnpm package:vsix
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: marketplace-vsix
          path: ${{ steps.version.outputs.vsix }}
          if-no-files-found: error
          retention-days: 14
      - name: Dry-run result
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Dry-run complete. VSIX is available as marketplace-vsix. No Release, token access, or Marketplace publish was performed.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
      VSIX_PATH: ${{ needs.package.outputs.vsix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: marketplace-vsix
          path: artifacts
      - name: Require configured publishing secret
        env:
          HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
        run: |
          if [ "$HAS_VSCE_PAT" != true ]; then
            echo 'VSCE_PAT is not configured. Follow docs/publishing.md.' >&2
            exit 1
          fi
      - name: Recheck version after environment approval
        run: |
          node scripts/release.mjs check "$RELEASE_TAG"
          pnpm --filter vibe-spec exec vsce show ijun17.vibe-spec --json > "$RUNNER_TEMP/marketplace.json"
          node scripts/release.mjs unpublished "$RUNNER_TEMP/marketplace.json"
      - name: Attach verified VSIX to a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "$VSIX_PATH" --verify-tag --draft --title "$RELEASE_TAG" --notes "VSIX built from $GITHUB_SHA after Linux and Windows checks."
      - name: Publish the same VSIX to Marketplace
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath "../../$VSIX_PATH" --skip-license --allow-missing-repository
      - name: Complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
